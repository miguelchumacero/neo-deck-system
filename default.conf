# neo-ui — sitio estático servido por nginx en Cloud Run.
# Puerto 8080 (Cloud Run). CORS abierto: un deck vive en otro origen (file://, otro host)
# y carga desde acá dist/neo-ui.css + las fuentes @font-face + los logos.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_min_length   512;
    gzip_types        text/css application/javascript application/json image/svg+xml text/html text/plain;

    # Cabeceras globales (heredadas salvo que una location defina las suyas).
    add_header Access-Control-Allow-Origin   "*"            always;
    add_header Cross-Origin-Resource-Policy  "cross-origin" always;
    add_header X-Content-Type-Options        "nosniff"      always;

    # Fuentes: MIME correcto (mime.types de nginx no trae .ttf) + CORS OBLIGATORIO
    # para @font-face cross-origin (sin él el navegador rechaza la fuente) + cache largo.
    location ~* \.ttf$ {
        default_type font/ttf;
        add_header   Cache-Control                "public, max-age=2592000, immutable" always;
        add_header   Access-Control-Allow-Origin  "*"            always;
        add_header   Cross-Origin-Resource-Policy "cross-origin" always;
        add_header   X-Content-Type-Options       "nosniff"      always;
    }

    # CSS pinneado por versión (dist/neo-ui@1.2.3.css): inmutable, cache máximo.
    location ~* /neo-ui@[^/]+\.css$ {
        add_header Cache-Control                "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin  "*"            always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options       "nosniff"      always;
    }

    # Imágenes (logos, backgrounds): cambian rara vez → cache 7 días.
    location ~* \.(png|jpe?g|svg|woff2?)$ {
        add_header Cache-Control                "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin  "*"            always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options       "nosniff"      always;
    }

    # Alias `latest` (dist/neo-ui.css), tokens.json: cache corto — cambian con cada deploy.
    location ~* \.(css|js|json)$ {
        add_header Cache-Control                "public, max-age=300" always;
        add_header Access-Control-Allow-Origin  "*"            always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options       "nosniff"      always;
    }

    # HTML y demás: cache corto para poder actualizar rápido.
    location / {
        try_files  $uri $uri/ =404;
        add_header Cache-Control                "public, max-age=300" always;
        add_header Access-Control-Allow-Origin  "*"            always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
